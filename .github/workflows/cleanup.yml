name: Abgelaufene Geschenke löschen

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/cleanup.mjs
      - name: Änderungen committen
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "geschenk-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Abgelaufene Geschenke gelöscht"
            git push
          fi
